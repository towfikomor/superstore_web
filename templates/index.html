<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini Superstore - Full MVC Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #f4f7f6; color: #333; }
        .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #0275d8; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f8f9fa; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: #fafafa; padding: 15px; border: 1px solid #e1e1e1; border-radius: 6px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 14px; }
        input, select { width: 100%; padding: 7px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; padding: 9px 14px; cursor: pointer; border-radius: 4px; width: 100%; font-weight: bold; }
        button:hover { background: #218838; }
        .section { margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🛒 Mini Superstore Management System</h1>
    
    <!-- Product Catalog -->
    <div class="section">
        <h2>Product Catalog</h2>
        <button onclick="loadAllData()" style="width: auto; padding: 5px 10px; margin-bottom: 10px;">Refresh Data</button>
        <table>
            <thead>
                <tr><th>ID</th><th>Name</th><th>Price</th><th>Stock</th><th>Category</th></tr>
            </thead>
            <tbody id="productTable"></tbody>
        </table>
    </div>

    <!-- Forms Grid -->
    <div class="grid">
        <!-- Add Product -->
        <div class="card">
            <h3>Add Product</h3>
            <form id="prodForm" onsubmit="addProduct(event)">
                <div class="form-group"><label>Name:</label><input type="text" id="pName" required></div>
                <div class="form-group"><label>Price ($):</label><input type="number" step="0.01" id="pPrice" required></div>
                <div class="form-group"><label>Stock:</label><input type="number" id="pStock" required></div>
                <div class="form-group"><label>Category ID (1: Groceries, 2: Elec, 3: Stat):</label><input type="number" id="pCat" value="1" required></div>
                <button type="submit">Save Product</button>
            </form>
        </div>

        <!-- Add Customer -->
        <div class="card">
            <h3>Register Customer</h3>
            <form id="custForm" onsubmit="addCustomer(event)">
                <div class="form-group"><label>Full Name:</label><input type="text" id="cName" required></div>
                <div class="form-group"><label>Email:</label><input type="email" id="cEmail" required></div>
                <button type="submit">Register Customer</button>
            </form>
        </div>
    </div>

    <!-- Place Order & Sales Report -->
    <div class="grid">
        <!-- Place Order -->
        <div class="card">
            <h3>Place an Order</h3>
            <form id="orderForm" onsubmit="placeOrder(event)">
                <div class="form-group"><label>Customer ID:</label><input type="number" id="oCustId" required></div>
                <div class="form-group"><label>Product ID:</label><input type="number" id="oProdId" required></div>
                <div class="form-group"><label>Quantity:</label><input type="number" id="oQty" value="1" required></div>
                <button type="submit">Submit Order</button>
            </form>
        </div>

        <!-- Customer Directory Quick View -->
        <div class="card">
            <h3>Customer Directory</h3>
            <table style="font-size: 13px;">
                <thead><tr><th>ID</th><th>Name</th><th>Email</th></tr></thead>
                <tbody id="customerTable"></tbody>
            </table>
        </div>
    </div>

    <!-- Sales Report Section -->
    <div class="section">
        <h2>Sales Transaction Report</h2>
        <table>
            <thead>
                <tr><th>Order ID</th><th>Customer Name</th><th>Date & Time</th><th>Total Amount ($)</th></tr>
            </thead>
            <tbody id="salesTable"></tbody>
        </table>
    </div>
</div>

<script>
    async function loadAllData() {
        // Load Products
        const resProd = await fetch('/api/products');
        const products = await resProd.json();
        let pHtml = '';
        products.forEach(p => {
            pHtml += `<tr><td>${p.id}</td><td>${p.name}</td><td>$${p.price.toFixed(2)}</td><td>${p.stock}</td><td>${p.category || 'N/A'}</td></tr>`;
        });
        document.getElementById('productTable').innerHTML = pHtml || '<tr><td colspan="5">No products</td></tr>';

        // Load Customers
        const resCust = await fetch('/api/customers');
        const customers = await resCust.json();
        let cHtml = '';
        customers.forEach(c => {
            cHtml += `<tr><td>${c.id}</td><td>${c.name}</td><td>${c.email}</td></tr>`;
        });
        document.getElementById('customerTable').innerHTML = cHtml || '<tr><td colspan="3">No customers</td></tr>';

        // Load Sales
        const resSales = await fetch('/api/sales');
        const sales = await resSales.json();
        let sHtml = '';
        sales.forEach(s => {
            sHtml += `<tr><td>${s.id}</td><td>${s.customer_name}</td><td>${s.order_date}</td><td>$${s.total_amount.toFixed(2)}</td></tr>`;
        });
        document.getElementById('salesTable').innerHTML = sHtml || '<tr><td colspan="4">No orders placed yet</td></tr>';
    }

    async function addProduct(e) {
        e.preventDefault();
        const data = {
            name: document.getElementById('pName').value,
            price: document.getElementById('pPrice').value,
            stock: document.getElementById('pStock').value,
            category_id: document.getElementById('pCat').value
        };
        const res = await fetch('/api/add_product', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
        const result = await res.json();
        alert(result.message);
        if(res.ok) { document.getElementById('prodForm').reset(); loadAllData(); }
    }

    async function addCustomer(e) {
        e.preventDefault();
        const data = { name: document.getElementById('cName').value, email: document.getElementById('cEmail').value };
        const res = await fetch('/api/add_customer', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
        const result = await res.json();
        alert(result.message);
        if(res.ok) { document.getElementById('custForm').reset(); loadAllData(); }
    }

    async function placeOrder(e) {
        e.preventDefault();
        const data = {
            customer_id: document.getElementById('oCustId').value,
            product_id: document.getElementById('oProdId').value,
            quantity: document.getElementById('oQty').value
        };
        const res = await fetch('/api/place_order', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
        const result = await res.json();
        alert(result.message);
        if(res.ok) { document.getElementById('orderForm').reset(); loadAllData(); }
    }

    window.onload = loadAllData;
</script>
</body>
</html>
